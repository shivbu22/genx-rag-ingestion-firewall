services:
  db:
    image: pgvector/pgvector:pg16
    container_name: genx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_password}
      POSTGRES_DB: ${POSTGRES_DB:-genx_rag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema + HNSW index are created on first boot of an empty volume.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-genx_rag}"]
      interval: 5s
      timeout: 5s
      retries: 12

  n8n:
    image: n8nio/n8n:latest
    container_name: genx-n8n
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # n8n's own state database (separate logical DB on the same server is
      # possible; here n8n keeps its state in SQLite inside its volume and
      # only the RAG tables live in Postgres, reached via a Postgres
      # credential pointing at host "db".)
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Berlin}
      # Connection values the workflows / credentials use to reach Postgres.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-genx_rag}
      DB_USER: ${POSTGRES_USER:-n8n}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-n8n_password}
      # LLM / embedding endpoints (defaults: local Ollama on the host).
      # bge-m3 produces the 1024-dim embeddings init.sql is built for.
      LLM_CHAT_URL: ${LLM_CHAT_URL:-http://host.docker.internal:11434/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      EMBEDDING_URL: ${EMBEDDING_URL:-http://host.docker.internal:11434/v1/embeddings}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # Mock dataset and workflow exports, read-only, for easy import.
      - ./data:/data:ro
      - ./workflows:/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  n8n_data:
